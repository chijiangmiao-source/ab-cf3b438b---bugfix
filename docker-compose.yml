services:
  api:
    build: .
    image: variable-code-verifier:latest
    environment:
      # 容器内监听端口（一般无需修改）
      PORT: "8000"
      HOST: "0.0.0.0"
    ports:
      # 宿主机端口可配置：HOST_PORT 环境变量，默认 8000
      - "${HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3); sys.exit(0 if json.load(r)['status']=='ok' else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # 可执行验收服务：对运行中的 api 做端到端验收，退出码即验收结论。
  # 用法： docker compose run --rm verify
  verify:
    image: variable-code-verifier:latest
    build: .
    depends_on:
      api:
        condition: service_healthy
    command: ["./verify", "--url", "http://api:8000"]
    environment:
      PYTHONUNBUFFERED: "1"
    profiles: ["acceptance"]
